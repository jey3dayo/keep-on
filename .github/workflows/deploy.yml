name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            .open-next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Generate Drizzle migrations
        run: pnpm db:generate

      - name: Build for Cloudflare
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: |
          echo "::group::Build timing"
          time pnpm build:cf
          echo "::endgroup::"

      # TODO: Sentry ソースマップアップロードは後のフェーズで実装
      # Issue #146 参照

      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # デプロイ直前に本番 D1 へ未適用のマイグレーションを適用する。
        # 「適用 → 直後にデプロイ」の順序を CI で保証し、手動適用漏れによる本番スキーマ乖離を防ぐ。
        run: pnpm wrangler d1 migrations apply keep-on-db --remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy

      - name: Post deployment notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🔗 https://keep-on.jey3dayo.net"
          echo "🔗 https://keep-on.j138cm.workers.dev"
